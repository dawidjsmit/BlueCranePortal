<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Blue Crane Vistas Portal logo">
  <title>Blue Crane Vistas Portal</title>
  <defs>
    <linearGradient id="bcDisc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Rounded badge background -->
  <rect x="2" y="2" width="116" height="116" rx="26" fill="url(#bcDisc)"/>

  <!-- Horizon arc, evoking "vistas" -->
  <path d="M16 90 Q60 76 104 90" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="3" stroke-linecap="round"/>

  <!-- ============ Blue crane, in profile (light on blue) ============ -->
  <g stroke="#eef4ff" fill="#eef4ff" stroke-linecap="round" stroke-linejoin="round">

    <!-- Legs -->
    <path d="M58 78 L54 100" fill="none" stroke-width="3"/>
    <path d="M66 78 L70 100" fill="none" stroke-width="3"/>
    <!-- Feet -->
    <path d="M54 100 l-5 2 M54 100 l4 2" fill="none" stroke-width="2.4"/>
    <path d="M70 100 l5 2 M70 100 l-4 2" fill="none" stroke-width="2.4"/>

    <!-- Body: rounded teardrop, fuller at the chest (left), tapering to tail (right) -->
    <path d="M44 68
             c-6 -10 2 -22 16 -22
             c10 0 18 5 24 12
             c5 6 9 9 15 10
             c-6 5 -14 6 -22 4
             c-8 -2 -14 -6 -20 -8
             c-6 -2 -10 2 -13 2 z"/>

    <!-- Signature trailing wing plumes sweeping down past the tail -->
    <path d="M92 68
             c7 2 13 6 18 13
             c-7 -1 -13 -2 -18 -6
             c3 4 5 8 6 13
             c-6 -3 -10 -8 -12 -14 z"/>

    <!-- Long S-curved neck up to a small head (top-left) -->
    <path d="M48 60
             C40 52 40 40 46 32
             C50 26 56 24 60 25"
          fill="none" stroke-width="7"/>

    <!-- Head -->
    <circle cx="56" cy="27" r="6.5" stroke="none"/>
  </g>

  <!-- Eye -->
  <circle cx="54.5" cy="26" r="1.6" fill="#1d4ed8"/>
  <!-- Beak, pointing left -->
  <path d="M50 27 l-9 1.5 9 2.2 z" fill="#f6c453" stroke="none"/>
</svg>
